apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: design-forge-main-ingress
  namespace: design-forge-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - designforge.website
        - www.designforge.website
        - api.designforge.website
      secretName: design-forge-main-tls
  rules:
    - host: "designforge.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: design-forge-frontend
                port:
                  number: 80

    - host: "www.designforge.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: design-forge-frontend
                port:
                  number: 80

    - host: "*.previews.designforge.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: design-forge-proxy
                port:
                  number: 80

    - host: "api.designforge.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80